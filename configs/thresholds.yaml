anomaly:
  statistical_zscore: 3.0
  isolation_forest_percentile: 5.0
  lof_percentile: 5.0
  ocsvm_percentile: 5.0
  elliptic_percentile: 5.0
  mahalanobis_percentile: 5.0
  weights:
    isolation_forest: 0.25
    lof: 0.20
    one_class_svm: 0.20
    elliptic_envelope: 0.15
    mahalanobis: 0.10
    robust_zscore: 0.10
  consensus:
    strong_agreement_threshold: 0.75
    moderate_agreement_threshold: 0.50
    detector_anomaly_cutoff: 0.50

decision:
  sensor_fault_threshold: 0.40
  genuine_extreme_threshold: 0.35
  confidence_min_correction: 0.80

severity:
  anomaly_score_medium: 0.40
  anomaly_score_high: 0.65
  anomaly_score_critical: 0.85
  confidence_medium: 0.60
  confidence_high: 0.80

uncertainty:
  disagreement_weight: 0.40
  coverage_penalty_weight: 0.30
  missing_evidence_weight: 0.30

health:
  fault_rate_weight: 0.40
  anomaly_rate_weight: 0.20
  missing_rate_weight: 0.15
  residual_weight: 0.15
  noise_weight: 0.10
  recent_window_hours: 24

qc:
  freeze_variance_threshold: 0.01
  freeze_min_consecutive: 3
  spike_zscore_threshold: 4.0
  drift_consecutive_threshold: 5
  temporal_gap_hours: 3.0

freeze_variance_threshold: 0.01
